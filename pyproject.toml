[tool.poetry]
name = "kniferpy"
version = "0.1.0"
description = "A Python utility toolkit with focused v* domain facades."
authors = ["imajinyun"]
readme = "README.md"
license = "MIT"
packages = [{ include = "kniferpy", from = "src" }]
homepage = "https://github.com/imajinyun/kniferpy"
repository = "https://github.com/imajinyun/kniferpy"
documentation = "https://github.com/imajinyun/kniferpy#readme"
keywords = ["utility", "json", "http", "crypto", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
requests = { version = "^2.32.0", optional = true }
PyJWT = { version = "^2.8.0", optional = true }
pillow = { version = "^10.0.0", optional = true }
qrcode = { version = "^7.4.0", optional = true }
openpyxl = { version = "^3.1.0", optional = true }
cryptography = { version = "^49.0.0", optional = true }
argon2-cffi = { version = "^25.1.0", optional = true }
gmssl = { version = "^3.2.0", optional = true }

[tool.poetry.extras]
http = ["requests"]
jwt = ["PyJWT", "cryptography"]
crypto = ["cryptography", "argon2-cffi", "gmssl"]
img = ["pillow", "qrcode"]
poi = ["openpyxl"]
all = [
    "requests",
    "PyJWT",
    "pillow",
    "qrcode",
    "openpyxl",
    "cryptography",
    "argon2-cffi",
    "gmssl",
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-cov = "^5.0.0"
ruff = "^0.5.0"
mypy = "^1.10.0"
pre-commit = "^3.8.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
