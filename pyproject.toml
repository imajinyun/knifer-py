[project]
name = "kniferpy"
version = "0.1.0"
description = "A Python utility toolkit with focused v* domain facades."
readme = "README.md"
license = "MIT"
authors = [{ name = "imajinyun" }]
requires-python = ">=3.11,<4.0"
keywords = ["utility", "json", "http", "crypto", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = []

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
requests = { version = "^2.32.0", optional = true }
PyJWT = { version = "^2.15.0", optional = true }
pillow = { version = ">=12.2.0,<13", optional = true }
qrcode = { version = "^7.4.0", optional = true }
openpyxl = { version = "^3.1.0", optional = true }
cryptography = { version = "^49.0.0", optional = true }
argon2-cffi = { version = "^25.1.0", optional = true }
gmssl = { version = "^3.2.0", optional = true }
[project.urls]
Homepage = "https://github.com/imajinyun/kniferpy"
Repository = "https://github.com/imajinyun/kniferpy"
Documentation = "https://github.com/imajinyun/kniferpy#readme"

[project.optional-dependencies]
http = ["requests>=2.32.0,<3.0.0"]
jwt = ["PyJWT>=2.8.0,<3.0.0", "cryptography>=49.0.0,<50.0.0"]
crypto = ["cryptography>=49.0.0,<50.0.0", "argon2-cffi>=25.1.0,<26.0.0", "gmssl>=3.2.0,<4.0.0"]
img = ["pillow>=12.2.0,<13.0.0", "qrcode>=7.4.0,<8.0.0"]
poi = ["openpyxl>=3.1.0,<4.0.0"]
all = [
    "requests>=2.32.0,<3.0.0",
    "PyJWT>=2.8.0,<3.0.0",
    "pillow>=12.2.0,<13.0.0",
    "qrcode>=7.4.0,<8.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    "cryptography>=49.0.0,<50.0.0",
    "argon2-cffi>=25.1.0,<26.0.0",
    "gmssl>=3.2.0,<4.0.0",
]

[tool.poetry]
packages = [{ include = "kniferpy", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3,<10"
pytest-cov = "^5.0.0"
ruff = "^0.5.0"
mypy = "^1.10.0"
pre-commit = "^3.8.0"
hypothesis = "^6.156.1"
twine = "^6.2.0"
cyclonedx-bom = "7.3.0"
pip-audit = "^2.10.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["kniferpy"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP017", "UP035", "UP036", "UP038", "UP041"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
