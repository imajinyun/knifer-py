name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: poetry

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip poetry
          poetry config virtualenvs.in-project true

      - name: Install dependencies
        run: make install

      - name: Release readiness
        run: make release-ready

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-smoke-release
          path: tmp/benchmark-smoke.json
          if-no-files-found: ignore

      - name: Generate SBOM
        run: make sbom-smoke

      - name: Attest distributions
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - name: Attest SBOM
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: sbom.cdx.json

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
    environment:
      name: pypi
      url: https://pypi.org/p/kniferpy
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
