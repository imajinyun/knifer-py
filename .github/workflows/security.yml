name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: poetry

      - name: Install audit tools
        run: python -m pip install --upgrade pip poetry poetry-plugin-export pip-audit

      - name: Export locked dependencies
        run: poetry export --all-extras --with dev --without-hashes -f requirements.txt -o requirements-audit.txt

      - name: Audit dependencies
        run: pip-audit -r requirements-audit.txt
