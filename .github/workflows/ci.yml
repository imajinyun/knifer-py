name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry

      - name: Install dependencies
        run: poetry install --all-extras

      - name: Lint
        run: poetry run ruff check src tests

      - name: Typecheck
        run: poetry run mypy src tests

      - name: API compatibility
        run: poetry run python scripts/check_api_snapshot.py

      - name: README smoke
        run: poetry run python scripts/check_readme_smoke.py

      - name: Examples smoke
        run: poetry run python examples/smoke.py

      - name: Test
        run: poetry run pytest

      - name: Coverage gate
        run: poetry run pytest --cov=kniferpy --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=95
