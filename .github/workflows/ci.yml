name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry

      - name: Install dependencies
        run: poetry install --all-extras

      - name: Lint
        run: poetry run ruff check src tests examples

      - name: Typecheck
        run: poetry run mypy src tests examples

      - name: API compatibility
        run: poetry run python scripts/check_api_snapshot.py

      - name: Error taxonomy
        run: poetry run python scripts/check_error_taxonomy.py

      - name: Facade consistency
        run: poetry run python scripts/check_facade_consistency.py

      - name: Facade status
        run: poetry run python scripts/check_facade_status.py

      - name: README smoke
        run: poetry run python scripts/check_readme_smoke.py

      - name: Examples smoke
        run: poetry run python examples/smoke.py

      - name: Benchmark smoke
        run: poetry run python scripts/benchmark_smoke.py --output tmp/benchmark-smoke.json --baseline api/benchmark-smoke-baseline.json

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-smoke-${{ matrix.os }}-py${{ matrix.python-version }}
          path: tmp/benchmark-smoke.json
          if-no-files-found: ignore

      - name: Test
        run: poetry run pytest

      - name: Coverage gate
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: poetry run pytest --cov=kniferpy --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=95

  pypy-smoke:
    name: ubuntu-latest / PyPy 3.10 smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PyPy
        uses: actions/setup-python@v5
        with:
          python-version: "pypy3.10"

      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install .

      - name: Import smoke
        run: python -c "import kniferpy; assert 'vjson' in kniferpy.__all__"

  minimum-deps:
    name: ubuntu-latest / minimum runtime dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimum runtime dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[all]" -c requirements-min.txt

      - name: Import smoke
        run: python -c "import kniferpy; assert 'vjson' in kniferpy.__all__"

      - name: Examples smoke
        run: python examples/smoke.py
